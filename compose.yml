services:
  proxy:
    build: services/proxy
    pull_policy: build
    restart: always
    depends_on:
      - orion
      - dashboard
    environment:
      - API_KEY=$API_KEY
      - THE_THINGS_NET_WEBHOOK_URL=$THE_THINGS_NET_WEBHOOK_URL

  mongo:
    image: mongo:4.2
    restart: always
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb

  orion:
    image: fiware/orion:3.3.0
    restart: always
    depends_on:
      - mongo
    entrypoint: ["sh", "-c", "rm /tmp/contextBroker.pid; /usr/bin/contextBroker -fg -multiservice -dbhost mongo -corsOrigin __ALL"]
    environment:
      - LOG_LEVEL=ERROR

  migrate:
    build: services/migrate
    restart: always
    pull_policy: build

  crate:
    image: crate:5.6
    restart: always
    volumes:
      - crate_data:/data
    environment:
      - CRATE_HEAP_SIZE=1g
    command: crate -Cauth.host_based.enabled=false -Cnetwork.host=0.0.0.0

  quantumleap:
    image: fiware/quantum-leap:1.0.0
    restart: always
    depends_on:
      - crate
      - migrate
    environment:
      - CRATE_HOST=crate

  dashboard:
    build: services/dashboard
    pull_policy: build
    restart: always

  collector:
    build:
      context: services/collector
      dockerfile: Dockerfile
    pull_policy: build
    restart: always
    depends_on:
    - orion
    environment:
    - OWM_API_KEY=$OPEN_WEATHER_MAP_API_KEY
    - LASA2X_ENDPOINT=$LASA2X_ENDPOINT
    - LASA2X_API_KEY=$LASA2X_API_KEY

  scheduled:
    build: services/scheduled
    pull_policy: build
    restart: always
    depends_on:
    - orion

  dashbot:
    image: ghcr.io/imiq-project/dashbot:latest
    pull_policy: always
    restart: always
    depends_on:
    - orion
    environment:
    - FIWARE_BASE_URL=https://imiq-public.et.uni-magdeburg.de/api/orion
    - FIWARE_API_KEY=unused
    - OPENAI_API_KEY=${OPENAI_API_KEY}
    - OPENAI_BASE_URL=https://api.openai.com/v1
    - NEO4J_URI=neo4j+s://46aaedf7.databases.neo4j.io
    - NEO4J_USERNAME=${NEO4J_USERNAME}
    - NEO4J_PASSWORD=${NEO4J_PASSWORD}
    - NEO4J_DATABASE=${NEO4J_DATABASE}
    - ORS_API_KEY=${ORS_API_KEY}
    - ORS_BASE_URL=https://api.openrouteservice.org
    - IMIQ_ROUTING_URL=https://imiq-app.et.uni-magdeburg.de/api/routing
    - IMIQ_GEOCODE_URL=https://imiq-public.et.uni-magdeburg.de/api/geocode
    - IMIQ_EVENTS_URL=https://imiq-public.et.uni-magdeburg.de/api/events
    - NOMINATIM_URL=https://nominatim.openstreetmap.org
    - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
    - ELEVENLABS_VOICE_ID=HKUbFf0kZdG11lOEhRi2
    - ELEVENLABS_TTS_MODEL=eleven_v3
    - ELEVENLABS_STT_MODEL=scribe_v2
    - ELEVENLABS_TTS_FAST_MODEL=eleven_v3
    - VOICE_REACTION_MODEL=gpt-5.4
    - VOICE_REACTION_REASONING=none
    - VOICE_REACTION_TIMEOUT=4
    - ELEVENLABS_TTS_STABILITY=0.35
    - SINGLE_AGENT_MODEL=gpt-5.4
    - AGENT_TIMEOUT=90
    - AGENT_VERBOSE_LOGGING=false
    - MAX_CONVERSATION_HISTORY=6
    - HTTP_TIMEOUT=10
    - MAGDEBURG_LAT=52.1205
    - MAGDEBURG_LON=11.6276
    - SEMANTIC_CACHE_ENABLED=false
    - HF_HUB_OFFLINE=1
    - STUDY_LOCATION_LAT=52.141220
    - STUDY_LOCATION_LON=11.654976
    - STUDY_LOCATION_NAME="IMIQ office (Building 80), Niels-Bohr-Straße 1, Alte Neustadt"
  sensors:
    build:
      context: services/sensors
      dockerfile: Dockerfile
    pull_policy: build
    restart: always
    depends_on:
    - orion
    environment:
    - WEATHER_STATION_PASSWORD=$WEATHER_STATION_PASSWORD
    - THE_THINGS_NET_WEBHOOK_URL=$THE_THINGS_NET_WEBHOOK_URL
  geocode-db:
    image: ghcr.io/imiq-project/postgisvector:latest
    restart: always
    pull_policy: always
    environment:
      POSTGRES_PASSWORD: geocoder
    volumes:
      - geocode-data:/var/lib/postgresql/data
  ollama:
    image: ollama/ollama:latest
    restart: always
    pull_policy: always
    volumes:
     - ollama-data:/root/.ollama
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "ollama serve &
      until ollama list >/dev/null 2>&1; do sleep 1; done &&
      ollama pull qwen3-embedding:4b &&
      wait"
  geocode:
    image: ghcr.io/imiq-project/geocode2:latest
    restart: always
    pull_policy: always
    environment:
      - SIMILARITY_THRESHOLD=.2
    command: geocoder --database postgres://postgres:geocoder@geocode-db:5432/postgres?sslmode=disable --embeddings-url http://ollama:11434/v1/embeddings --listen 0.0.0.0:8001
  events-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: ${EVENTS_DB_PASSWORD}
    volumes:
      - events_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  events:
    image: ghcr.io/imiq-project/events:latest
    pull_policy: always
    depends_on:
      events-db:
        condition: service_healthy
    environment:
      DB_HOST: events-db
      DB_PASSWORD: ${EVENTS_DB_PASSWORD}
      LOOKAHEAD_DAYS: 30
    restart: always

volumes:
  mongo_data:
  mongo_config:
  crate_data:
  events_data:
  ollama-data:
  geocode-data:
